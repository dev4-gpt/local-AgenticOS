name: Product experience release gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  product-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: product-experience
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product-experience/package-lock.json
      - run: npm ci
      - run: npm run verify:release-gates
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
